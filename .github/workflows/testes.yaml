name: 🧪 Pipeline de Testes MCP

# Define quando os testes vão rodar (ao fazer push ou PR para a branch main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar o repositório
      uses: actions/checkout@v4

    - name: 🐍 Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # Ajuste para a versão que vocês usam

    - name: 📦 Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Subir o servidor FastAPI (Background)
      run: |
        cd deep-dish-server
        # O "&" no final faz o servidor rodar solto em segundo plano
        uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        
        # Espera 3 segundos para garantir que o Uvicorn ligou completamente
        sleep 3 

    - name: 🎯 Rodar todos os testes (Mock e Integração)
      run: |
        # Roda todos os 12 testes de uma vez e exibe o relatório
        pytest --cov=mcp_server --cov-report term-missing testes/